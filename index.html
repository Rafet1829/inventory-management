function busy(v){$('loading').classList.toggle('hidden',!v)}function toast(msg,err=false){const el=$('toast');el.textContent=msg;el.className='toast'+(err?' err':'');el.classList.remove('hidden');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.add('hidden'),3200)}function errText(e){return e?.message||String(e||'Something went wrong')}async function safe(fn){busy(true);try{return await fn()}catch(e){console.error(e);toast(errText(e),true);throw e}finally{busy(false)}}

function stockMode(){return state.settings?.stock_mode==='peak'?'peak':'off_peak'}
function stockModeLabel(){return stockMode()==='peak'?'PEAK':'OFF PEAK'}
function activeMaxHold(p){const v=stockMode()==='peak'?p.peak_max_hold:p.off_peak_max_hold;return (v===null||v===undefined||v==='')?null:n(v)}

function supplierKey(p){
  const s=(supplierName(p.supplier_id)||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(s.includes('turner'))return 'turner';
  if(s.includes('firstchoice'))return 'firstchoice';
  if(s.includes('potts'))return 'potts';
  return 'other';
}
function dayDiff(from,to){return (to-from+7)%7}
function supplierScheduleInfo(p,now=new Date()){
  const k=supplierKey(p),d=now.getDay(); // 0 Sun ... 6 Sat
  // coverageDays = expected days the new delivery should cover until the following delivery.
  if(k==='turner'){
    const cycles=[{o:1,d:2,next:4},{o:3,d:4,next:6},{o:5,d:6,next:2}];
    let best=null;
    for(const c of cycles){
      const wait=dayDiff(d,c.o);
      if(best===null||wait<best.wait)best={...c,wait};
    }
    const deliveryWait=best.wait+dayDiff(best.o,best.d);
    const coverage=dayDiff(best.d,best.next)||7;
    return {key:k,orderDay:best.o,deliveryDay:best.d,daysToDelivery:deliveryWait,coverageDays:coverage,
      text:`${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][best.o]} order → ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][best.d]} delivery · cover ${coverage} day${coverage===1?'':'s'}`};
  }
  if(k==='potts'){
    // Tue -> Wed; Thu order supplies Fri and next Mon. For ordering quantity,
    // Thursday's delivery coverage is treated through the next Tuesday/Wednesday cycle.
    const candidates=[
      {o:2,d:3,next:5,label:'Tue order → Wed delivery'},
      {o:4,d:5,next:1,label:'Thu order → Fri delivery'},
      {o:4,d:1,next:3,label:'Thu order → Mon delivery'}
    ];
    let best=null;
    for(const c of candidates){
      const wait=dayDiff(d,c.o);
      const dw=wait+dayDiff(c.o,c.d);
      if(best===null||dw<best.dw)best={...c,wait,dw};
    }
    const coverage=dayDiff(best.d,best.next)||7;
    return {key:k,orderDay:best.o,deliveryDay:best.d,daysToDelivery:best.dw,coverageDays:coverage,
      text:`${best.label} · cover ${coverage} day${coverage===1?'':'s'}`};
  }
  if(k==='firstchoice'){
    // Daily ordering; no Sunday delivery. Bank holidays remain a manual exception because
    // the app has no live UK bank-holiday calendar.
    let delivery=(d+1)%7,wait=1;
    if(delivery===0){delivery=1;wait=2}
    return {key:k,orderDay:d,deliveryDay:delivery,daysToDelivery:wait,coverageDays:1,
      text:`Daily order → next delivery ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][delivery]} · no Sunday/BH delivery`};
  }
  return {key:k,orderDay:null,deliveryDay:null,daysToDelivery:0,coverageDays:null,
    text:'No delivery schedule set · Max Hold fallback'};
}
function smartSuggestedOrder(p){
  const target=activeMaxHold(p);
  if(target===null)return {qty:null,target:null,need:null,usage:n(metric(p.id).avg_daily_usage),schedule:supplierScheduleInfo(p),method:'No Max Hold'};
  const stock=n(p.current_stock),onOrder=n(p.on_order_qty),usage=Math.max(0,n(metric(p.id).avg_daily_usage));
  const schedule=supplierScheduleInfo(p);
  // If we have usable history and a known schedule, cover demand until delivery + the
  // period that delivery must last. Otherwise retain the proven Max Hold fill logic.
  if(schedule.key!=='other' && usage>0){
    const horizon=Math.max(1,schedule.daysToDelivery+schedule.coverageDays);
    const demand=Math.ceil(usage*horizon);
    const desired=Math.min(target,Math.max(n(p.safety_stock),demand));
    const qty=Math.max(0,Math.ceil(desired-stock-onOrder));
    return {qty,target,need:desired,usage,schedule,horizon,method:'Schedule + usage'};
  }
  const qty=Math.max(0,Math.ceil(target-stock-onOrder));
  return {qty,target,need:target,usage,schedule,horizon:null,method:'Max Hold fallback'};
}
function suggestedOrderQty(p){return smartSuggestedOrder(p).qty}

async function setStockMode(mode){

  await safe(async()=>{
    const r=await sb.rpc('set_stock_mode',{p_mode:mode});if(r.error)throw r.error;

}

}
function statusBadge(s){s=s||'Normal';return `<span class="status ${s}">${esc(s)}</span>`}function productName(id){return state.products.find(p=>p.id===id)?.name||id}function supplierName(id){return state.suppliers.find(s=>s.id===id)?.name||'Not assigned'}function metric(id){return state.metrics.find(m=>m.product_id===id)||{usage_7d:0,usage_30d:0,avg_daily_usage:0,days_remaining:null,recommended_par:0}}function productTags(id){const tids=state.productTags.filter(x=>x.product_id===id).map(x=>x.tag_id);return state.tags.filter(t=>tids.includes(t.id))}
function toggleAuthMode(){signupMode=!signupMode;$('signupNameField').classList.toggle('hidden',!signupMode);$('authButton').textContent=signupMode?'Create account':'Sign in';$('authSwitchText').textContent=signupMode?'Already have an account?':'First time?';$('authSwitchLink').textContent=signupMode?'Sign in':'Create account';$('forgotRow').classList.toggle('hidden',signupMode)}
async function submitAuth(){
  const email=$('authEmail').value.trim();
  const password=$('authPassword').value;
  if(!email||!password)return toast('Email and password are required.',true);

  if(navigator.onLine===false)return toast('This device is offline. Reconnect and try again.',true);
  busy(true);
  try{
    if(signupMode){
      const display_name=$('authName').value.trim()||email.split('@')[0];
      const {data,error}=await withTimeout_(
        sb.auth.signUp({email,password,options:{data:{display_name},emailRedirectTo:APP_URL}}),
        20000,'Sign up'
      );
      if(error)throw error;
      if(!data?.session){
        toast('Account created. Check your email if confirmation is enabled.');
        toggleAuthMode();
        return;
      }
      await startApp(data.user);
      return;
    }

    const {data,error}=await withTimeout_(sb.auth.signInWithPassword({email,password}),30000,'Sign in');
    if(error)throw error;
    if(!data?.session||!data?.user)throw new Error('No login session was returned.');
    await startApp(data.user);
  }catch(e){
    console.error('AUTH ERROR',e);
    const msg=String(e?.message||e||'');
    toast(/timed out/i.test(msg)
      ? 'Cannot reach the login service. Check the connection and try again.'
      : errText(e),true);
  }finally{
    busy(false);
  }
}

async function logout(){
  const btn=document.querySelector('button[onclick="logout()"]');
  if(btn){btn.disabled=true;btn.textContent='Logging out…'}

  state.user=null;
  __startingApp=false;
  showAuthView_();
  $('resetAuthFields').classList.add('hidden');
  $('normalAuthFields').classList.remove('hidden');
  $('authTitle').textContent='Inventory Manager';
  $('authSubtitle').textContent='Fast inventory management powered by PostgreSQL.';
  $('authPassword').value='';

  try{
    const {error}=await withTimeout_(sb.auth.signOut({scope:'local'}),8000,'Logout');
    if(error)throw error;
  }catch(e){
    console.warn('Logout service unavailable; clearing browser auth session.',e);
    try{
      for(const storage of [localStorage,sessionStorage]){
        Object.keys(storage)
          .filter(k=>k.startsWith('sb-')&&k.endsWith('-auth-token'))
          .forEach(k=>storage.removeItem(k));
      }
    }catch(_){}
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Logout'}
  }
}

function showAppView_(user){

function withTimeout_(promise,ms,label){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error((label||'Request')+' timed out.')),ms))])}
async function startApp(knownUser){
  if(__startingApp)return;
  __startingApp=true;
  try{
    let user=knownUser||null;
    if(!user){
      const {data,error}=await withTimeout_(sb.auth.getSession(),8000,'Session');
      if(error)throw error;
      user=data?.session?.user||null;
    }
    if(!user){showAuthView_();return}

    // Authentication is complete before inventory requests begin.
    showAppView_(user);
    state.page='dashboard';
    await go('dashboard');

    try{
      await loadCore();
      await go(state.page||'dashboard');
    }catch(e){
      console.error('INVENTORY STARTUP ERROR',e);
      toast('You are signed in, but some inventory data did not load. Refresh the page once.',true);
    }
  }catch(e){
    console.error('SESSION STARTUP ERROR',e);
    showAuthView_();
    toast(errText(e),true);
  }finally{
    __startingApp=false;
    busy(false);
  }
}
async function loadCore(){
  busy(true);
  try{
    // Essential data first so a slow optional report table can never trap the app on Login.
    const [pr,su,se]=await Promise.all([
      withTimeout_(sb.from('products').select('*').is('deleted_at',null).order('name'),15000,'Products'),
      withTimeout_(sb.from('suppliers').select('*').eq('active',true).order('name'),15000,'Suppliers'),
      withTimeout_(sb.from('inventory_settings').select('*').eq('id',1).maybeSingle(),15000,'Settings')
    ]);
    if(pr.error)throw pr.error;
    if(su.error)throw su.error;
    if(se.error)console.warn('Settings load:',se.error);
    state.products=pr.data||[];
    state.suppliers=su.data||[];
    state.settings=se.data||{stock_mode:'off_peak'};
    syncStockModeControl();

    // Optional/history data: failures no longer prevent Dashboard from loading.
    const optional=await Promise.allSettled([
      withTimeout_(sb.from('tags').select('*').eq('active',true).order('name'),12000,'Tags'),
      withTimeout_(sb.from('product_tags').select('*'),12000,'Product tags'),
      withTimeout_(sb.from('stock_transactions').select('*').order('transaction_date',{ascending:false}).limit(2000),12000,'Transactions'),
      withTimeout_(sb.from('waste_logs').select('*').order('waste_date',{ascending:false}).limit(2000),12000,'Waste'),
      withTimeout_(sb.from('product_metrics').select('*'),12000,'Metrics'),
      withTimeout_(sb.from('purchase_orders').select('*').order('expected_arrival',{ascending:true}).limit(2000),12000,'Purchase orders'),
      withTimeout_(sb.from('master_orders').select('*').order('order_number',{ascending:false}).limit(1000),12000,'Master orders'),
      withTimeout_(sb.from('activity_logs').select('*').order('occurred_at',{ascending:false}).limit(1000),12000,'Activity'),
      withTimeout_(sb.from('recycle_bin').select('*').is('restored_at',null).order('deleted_at',{ascending:false}),12000,'Recycle bin')
    ]);
    const keys=['tags','productTags','transactions','waste','metrics','purchaseOrders','masterOrders','activity','recycle'];
    optional.forEach((res,i)=>{
      if(res.status==='fulfilled'&&!res.value.error)state[keys[i]]=res.value.data||[];
      else{
        state[keys[i]]=[];
        console.warn('Optional load failed:',keys[i],res.status==='rejected'?res.reason:res.value.error);
      }
    });

    // Cleanup must never block login.
    Promise.resolve(sb.rpc('purge_expired_recycle_bin')).catch(()=>{});
  }finally{
    busy(false);
  }
}

function outstandingOrders(productId){return (state.purchaseOrders||[]).filter(o=>o.product_id===productId&&['open','partially_received'].includes(o.status)&&n(o.quantity_ordered)>n(o.quantity_received))}
function nextArrival(productId){const rows=outstandingOrders(productId).filter(o=>o.expected_arrival).sort((a,b)=>String(a.expected_arrival).localeCompare(String(b.expected_arrival)));return rows[0]||null}

async function saveProduct(id=''){const nullableNum=id=>{const v=$(id).value.trim();return v===''?null:n(v)};const payload={name:$('fName').value.trim(),pack_size:$('fPack').value.trim()||null,sku:$('fSku').value.trim()||null,category:$('fCat').value.trim()||null,unit:$('fUnit').value.trim()||null,supplier_id:$('fSupplier').value||null,current_stock:n($('fStock').value),safety_stock:n($('fSafety').value),off_peak_max_hold:nullableNum('fOffMax'),peak_max_hold:nullableNum('fPeakMax'),on_order_qty:n($('fOnOrder').value),reorder_date:$('fReorder').value||null};if(!payload.name)return toast('Product name is required.',true);await safe(async()=>{let pid=id;if(id){const r=await sb.from('products').update(payload).eq('id',id).select().single();if(r.error)throw r.error}else{const r=await sb.from('products').insert(payload).select().single();if(r.error)throw r.error;pid=r.data.id}const del=await sb.from('product_tags').delete().eq('product_id',pid);if(del.error)throw del.error;const tids=[...document.querySelectorAll('.tagCheck:checked')].map(x=>x.value);if(tids.length){const ins=await sb.from('product_tags').insert(tids.map(tag_id=>({product_id:pid,tag_id})));if(ins.error)throw ins.error}await sb.rpc('log_activity',{p_action:id?'Edit Product':'Add Product',p_details:payload.name});closeModal();await loadCore();await renderProducts();toast('Product saved.')})}

async function saveBulk(){const rows=$('bulkText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const a=line.split('|').map(x=>x.trim());return{name:a[0],pack_size:a[1]||null,sku:a[2]||null}}).filter(x=>x.name);if(!rows.length)return toast('No valid products.',true);await safe(async()=>{const r=await sb.from('products').insert(rows);if(r.error)throw r.error;await sb.rpc('log_activity',{p_action:'Bulk Import',p_details:`${rows.length} products`});closeModal();await loadCore();await renderProducts();toast(`${rows.length} products imported.`)})}
function openCsvImport(){modal('Import Products CSV',`<div class="notice">Headers supported: Name or Product, PackSize or Pack Size, SKU, Category, Unit, CurrentStock, ParLevel.</div><div class="field"><label>CSV file</label><input id="csvFile" type="file" accept=".csv,text/csv"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="importCsv()">Import CSV</button></div>`)}
function parseCsv(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const parse=line=>{let a=[],cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){a.push(cur.trim());cur=''}else cur+=c}a.push(cur.trim());return a};const h=parse(lines[0]).map(x=>x.toLowerCase().replace(/\s+/g,''));return lines.slice(1).map(l=>{const v=parse(l),o={};h.forEach((k,i)=>o[k]=v[i]??'');return o})}
async function importCsv(){
 const file=$('csvFile').files[0];
 if(!file)return toast('Choose a CSV file.',true);

 const raw=parseCsv(await file.text()).map(o=>({
   name:(o.name||o.product||'').trim(),
   pack_size:(o.packsize||'').trim()||null,
   sku:(o.sku||'').trim()||null,
   category:(o.category||'').trim()||null,
   unit:(o.unit||'').trim()||null,
   current_stock:n(o.currentstock),
   off_peak_max_hold:(o.offpeakmaxhold||o.offpeakmax||'')===''?null:n(o.offpeakmaxhold||o.offpeakmax),peak_max_hold:(o.peakmaxhold||o.peakmax||'')===''?null:n(o.peakmaxhold||o.peakmax),safety_stock:n(o.safetystock)
 })).filter(x=>x.name);

 if(!raw.length)return toast('No products found in CSV.',true);

 await safe(async()=>{
   const existingRes=await sb.from('products').select('name,pack_size,sku').is('deleted_at',null);
   if(existingRes.error)throw existingRes.error;

   const norm=s=>String(s||'').trim().toLowerCase();
   const existingSku=new Set((existingRes.data||[]).map(x=>norm(x.sku)).filter(Boolean));
   const existingNamePack=new Set((existingRes.data||[]).map(x=>norm(x.name)+'|'+norm(x.pack_size)));

   const seenSku=new Set();
   const seenNamePack=new Set();
   const toInsert=[];
   let skippedExisting=0, skippedCsv=0;

   for(const row of raw){
     const skuKey=norm(row.sku);
     const npKey=norm(row.name)+'|'+norm(row.pack_size);

     const dupExisting=(skuKey&&existingSku.has(skuKey))||existingNamePack.has(npKey);
     if(dupExisting){skippedExisting++;continue}

     const dupCsv=(skuKey&&seenSku.has(skuKey))||seenNamePack.has(npKey);
     if(dupCsv){skippedCsv++;continue}

     if(skuKey)seenSku.add(skuKey);
     seenNamePack.add(npKey);
     toInsert.push(row);
   }

   let imported=0;
   for(let i=0;i<toInsert.length;i+=300){
     const batch=toInsert.slice(i,i+300);
     const r=await sb.from('products').insert(batch);
     if(r.error)throw r.error;
     imported+=batch.length;
   }

   await sb.rpc('log_activity',{
     p_action:'CSV Import',
     p_details:`Imported ${imported}; skipped existing ${skippedExisting}; skipped CSV duplicates ${skippedCsv}`
   });

   closeModal();
   await loadCore();
   await renderProducts();
   toast(`CSV complete: ${imported} imported, ${skippedExisting+skippedCsv} duplicates skipped.`);
 });
}

function productPickerHtml_(prefix, initialId=''){
  const p=initialId?state.products.find(x=>x.id===initialId):null;
  const label=p ? [p.name,p.pack_size,p.sku].filter(Boolean).join(' · ') : '';
  return `<div class="productPicker">
    <input id="${prefix}Search" class="productSearchInput" autocomplete="off"
      placeholder="Search product name, SKU or pack size..." value="${esc(label)}">
    <input id="${prefix}Id" type="hidden" value="${esc(initialId||'')}">
    <button type="button" class="productPickerClear" onclick="clearProductPicker_('${prefix}')" aria-label="Clear product">×</button>
    <div id="${prefix}Results" class="productPickerResults"></div>
  </div>`;
}
function initProductPicker_(prefix,onSelect){
  const input=$(prefix+'Search'), hidden=$(prefix+'Id'), box=$(prefix+'Results');
  if(!input||!hidden||!box)return;
  let active=-1;
  const draw=()=>{
    const q=input.value.trim().toLowerCase();
    const matches=state.products.filter(p=>{
      const hay=[p.name,p.sku,p.pack_size,p.category].join(' ').toLowerCase();
      return !q || hay.includes(q);
    }).slice(0,40);
    active=-1;
    box.innerHTML=matches.length?matches.map(p=>`<button type="button" class="productPickerItem" data-id="${p.id}">
      <b>${esc(p.name)}</b>
      <small>${esc([p.pack_size,p.sku,p.unit].filter(Boolean).join(' · ')||'No pack/SKU')}</small>
    </button>`).join(''):'<div class="productPickerEmpty">No matching products.</div>';
    box.classList.add('open');
    box.querySelectorAll('.productPickerItem').forEach(btn=>btn.onclick=()=>{
      const p=state.products.find(x=>x.id===btn.dataset.id);
      hidden.value=p.id;
      input.value=[p.name,p.pack_size,p.sku].filter(Boolean).join(' · ');
      box.classList.remove('open');
      if(onSelect)onSelect(p);
    });
  };
  input.addEventListener('focus',draw);
  input.addEventListener('input',()=>{hidden.value='';draw()});
  input.addEventListener('keydown',e=>{
    const items=[...box.querySelectorAll('.productPickerItem')];
    if(e.key==='Escape'){box.classList.remove('open');return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!items.length)return;
      active=e.key==='ArrowDown'?Math.min(active+1,items.length-1):Math.max(active-1,0);
      items.forEach((x,i)=>x.classList.toggle('active',i===active));
      items[active]?.scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'&&active>=0&&items[active]){
      e.preventDefault();items[active].click();
    }
  });
  document.addEventListener('click',e=>{
    if(!input.closest('.productPicker')?.contains(e.target))box.classList.remove('open');
  },{once:false});
}
function clearProductPicker_(prefix){
  const input=$(prefix+'Search'),hidden=$(prefix+'Id'),box=$(prefix+'Results');
  if(input)input.value='';if(hidden)hidden.value='';if(box)box.classList.remove('open');
  if(input){input.focus();input.dispatchEvent(new Event('input',{bubbles:true}))}
}

async function saveOnOrder(productId){
  const el=$('orderQtyInput');
  if(!el)return toast('On Order field not found.',true);
  const qty=n(el.value);
  if(qty<0)return toast('Quantity cannot be negative.',true);
  await safe(async()=>{
    // Save directly to the product row. This avoids relying on a missing RPC
    // and makes the Ordering edit button work with the existing database schema.
    const r=await sb.from('products').update({on_order_qty:qty}).eq('id',productId).select().single();
    if(r.error)throw r.error;
    const p=state.products.find(x=>x.id===productId);
    await Promise.resolve(sb.rpc('log_activity',{
      p_action:'Update On Order',
      p_details:`${p?.name||'Product'}: ${qty} on order`
    })).catch(()=>{});
    closeModal();
    await loadCore();
    await renderOrdering();
    toast(`On Order saved: ${fmt(qty)}.`);
  });
}

function renderAnalytics(){

    <div class="metric"><span>Waste · 7 Days</span><b>${fmt(waste7)}</b><small>${fmt(waste30)} in 30 days</small></div>
  </div>
  ${(out.length||low.length)?`<div class="notice" style="margin-bottom:12px"><b>Attention:</b> ${out.length?`${out.length} product${out.length===1?' is':'s are'} out of stock`:''}${out.length&&low.length?' · ':''}${low.length?`${low.length} product${low.length===1?' is':'s are'} at/below Safety Stock`:''}.</div>`:''}
  <div class="grid2">
    <div class="card"><h3 style="font-size:13px;margin-top:0">Stock Risk · Lowest Days Cover</h3>${risk.length?risk.map(x=>`<div class="listrow"><span><b>${esc(x.p.name)}</b><small class="muted" style="display:block">${fmt(x.p.current_stock)} on hand · ${fmt(x.m.avg_daily_usage)}/day</small></span><b>${x.days<99?fmt(x.days)+' d':'—'}</b></div>`).join(''):'<div class="empty">Not enough Keyline usage history yet.</div>'}</div>
    <div class="card"><h3 style="font-size:13px;margin-top:0">Fast Movers · Usage / Day</h3>${fast.length?fast.map(x=>`<div class="barrow"><div>${esc(x.p.name)}</div><div class="bartrack"><div class="barfill" style="width:${Math.max(2,n(x.m.avg_daily_usage)/max*100)}%"></div></div><div>${fmt(x.m.avg_daily_usage)}</div></div>`).join(''):'<div class="empty">Not enough usage history yet.</div>'}</div>
    <div class="card"><h3 style="font-size:13px;margin-top:0">Deliveries · Overdue / Today / Upcoming</h3>${poRows.length?`<div class="tablewrap"><table><thead><tr><th>Arrival</th><th>Product</th><th>Supplier</th><th>Outstanding</th></tr></thead><tbody>${poRows.map(o=>{const rem=Math.max(0,n(o.quantity_ordered)-n(o.quantity_received)),label=o.expected_arrival<today?'Overdue':o.expected_arrival===today?'Today':dstr(o.expected_arrival);return `<tr class="${o.expected_arrival<today?'out':o.expected_arrival===today?'low':''}"><td><b>${label}</b></td><td>${esc(productName(o.product_id))}</td><td>${esc(supplierName(o.supplier_id))}</td><td>${fmt(rem)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No outstanding deliveries.</div>'}</div>
    <div class="card"><h3 style="font-size:13px;margin-top:0">Outstanding Orders by Supplier</h3>${Object.keys(supplierOpen).length?Object.entries(supplierOpen).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="listrow"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">Nothing currently on order.</div>'}</div>
    <div class="card"><h3 style="font-size:13px;margin-top:0">Waste by Type · 30 Days</h3>${Object.entries(wb).length?Object.entries(wb).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="listrow"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">No waste logged in the last 30 days.</div>'}</div>
    <div class="card"><h3 style="font-size:13px;margin-top:0">Stock Status</h3><div class="listrow"><span>Normal</span><b>${state.products.length-out.length-low.length}</b></div><div class="listrow"><span>Low</span><b>${low.length}</b></div><div class="listrow"><span>Out</span><b>${out.length}</b></div><div class="listrow"><span>Total Products</span><b>${state.products.length}</b></div></div>
  </div>`
}
function renderReports(){$('main').innerHTML=`<div class="head"><div><h1>Reports</h1><p>Export filtered data as CSV or print to PDF.</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>Report</label><select id="repType"><option value="inventory">Inventory Snapshot</option><option value="transactions">Transactions</option><option value="waste">Waste Report</option><option value="orders">Purchase Orders</option><option value="receiving">Receiving Report</option></select></div><div class="field"><label>Product</label><select id="repProduct"><option value="all">All Products</option>${state.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Supplier</label><select id="repSupplier"><option value="all">All Suppliers</option>${state.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Start Date</label><input id="repStart" type="date"></div><div class="field"><label>End Date</label><input id="repEnd" type="date"></div></div><div class="actions"><button class="btn primary" onclick="exportReportCsv()">Export CSV</button><button class="btn" onclick="printReport()">Print / Save PDF</button></div></div><div id="repPreview" style="margin-top:12px"></div>`;renderReportPreview();['repType','repProduct','repSupplier','repStart','repEnd'].forEach(id=>$(id).onchange=renderReportPreview)}
function reportRows(){const ty=$('repType').value,pid=$('repProduct').value,sid=$('repSupplier')?.value||'all',s=$('repStart').value,e=$('repEnd').value;if(ty==='inventory')return state.products.filter(p=>(pid==='all'||p.id===pid)&&(sid==='all'||p.supplier_id===sid)).map(p=>{const m=metric(p.id);return{Product:p.name,SKU:p.sku||'',PackSize:p.pack_size||'',Stock:p.current_stock,Unit:p.unit||'',SafetyStock:p.safety_stock,OffPeakMax:p.off_peak_max_hold??'',PeakMax:p.peak_max_hold??'',OnOrder:p.on_order_qty,UsagePerDay:m.avg_daily_usage??0,Status:p.status,Supplier:supplierName(p.supplier_id)}});if(ty==='transactions')return state.transactions.filter(t=>(pid==='all'||t.product_id===pid)&&(!s||new Date(t.transaction_date)>=new Date(s))&&(!e||new Date(t.transaction_date)<=new Date(e+'T23:59:59'))).map(t=>({Date:dtstr(t.transaction_date),Product:productName(t.product_id),Type:t.transaction_type,Quantity:t.quantity,Unit:t.unit||'',Delta:t.delta,Previous:t.previous_stock,Result:t.resulting_stock,Notes:t.notes||''}));if(ty==='waste')return state.waste.filter(w=>(pid==='all'||w.product_id===pid)&&(!s||new Date(w.waste_date)>=new Date(s))&&(!e||new Date(w.waste_date)<=new Date(e+'T23:59:59'))).map(w=>({Date:dtstr(w.waste_date),Product:productName(w.product_id),Type:w.waste_type,Amount:w.amount,Unit:w.unit||'',Notes:w.notes||''}));if(ty==='orders')return state.purchaseOrders.filter(o=>o.status!=='draft'&&(pid==='all'||o.product_id===pid)&&(sid==='all'||o.supplier_id===sid)&&(!s||o.ordered_on>=s)&&(!e||o.ordered_on<=e)).map(o=>({Order:masterOrderLabel(o.master_order_id),OrderDate:o.ordered_on,Supplier:supplierName(o.supplier_id),Product:productName(o.product_id),Ordered:o.quantity_ordered,ExpectedDelivery:o.expected_arrival,Received:o.quantity_received,Outstanding:Math.max(0,n(o.quantity_ordered)-n(o.quantity_received)),Status:o.status}));return state.transactions.filter(t=>t.transaction_type==='received'&&(pid==='all'||t.product_id===pid)&&(!s||new Date(t.transaction_date)>=new Date(s))&&(!e||new Date(t.transaction_date)<=new Date(e+'T23:59:59'))).filter(t=>{const o=state.purchaseOrders.find(o=>o.id===t.purchase_order_id);return sid==='all'||o?.supplier_id===sid}).map(t=>{const o=state.purchaseOrders.find(o=>o.id===t.purchase_order_id);return{ReceivingDate:dtstr(t.transaction_date),Order:o?masterOrderLabel(o.master_order_id):'Manual',Supplier:o?supplierName(o.supplier_id):'',Product:productName(t.product_id),Quantity:t.quantity,Unit:t.unit||'',ExpectedDelivery:o?.expected_arrival||'',Notes:t.notes||''}})}
function renderReportPreview(){if(!$('repPreview'))return;const rows=reportRows();$('repPreview').innerHTML=`<div class="card"><h3 style="font-size:13px;margin-top:0">Preview · ${rows.length} rows</h3>${rows.length?`<div class="tablewrap"><table><thead><tr>${Object.keys(rows[0]).map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr>${Object.values(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No rows.</div>'}</div>`}function exportReportCsv(){const rows=reportRows();if(!rows.length)return toast('No data to export.',true);const headers=Object.keys(rows[0]),q=v=>`"${String(v??'').replace(/"/g,'""')}"`,csv=[headers.map(q).join(','),...rows.map(r=>headers.map(h=>q(r[h])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`inventory-${$('repType').value}-${isoDate(new Date())}.csv`;a.click();URL.revokeObjectURL(a.href)}function printReport(){renderReportPreview();window.print()}
function renderActivity(){$('main').innerHTML=`<div class="head"><div><h1>Activity</h1><p>Read-only audit log.</p></div></div><div class="card">${state.activity.length?`<div class="tablewrap"><table><thead><tr><th>Time</th><th>Action</th><th>Details</th></tr></thead><tbody>${state.activity.map(a=>`<tr><td>${dtstr(a.occurred_at)}</td><td><b>${esc(a.action)}</b></td><td>${esc(a.details||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity yet.</div>'}</div>`}
function renderRecycle(){$('main').innerHTML=`<div class="head"><div><h1>Recycle Bin</h1><p>Deleted products remain restorable for 30 days.</p></div></div><div class="card">${state.recycle.length?`<div class="tablewrap"><table><thead><tr><th>Deleted</th><th>Product</th><th>Expires</th><th>Actions</th></tr></thead><tbody>${state.recycle.map(r=>`<tr><td>${dtstr(r.deleted_at)}</td><td><b>${esc(r.product_snapshot?.name||r.product_id)}</b></td><td>${dtstr(r.expires_at)}</td><td><div class="actions"><button class="btn small success" onclick="restoreProduct('${r.product_id}')">Restore</button><button class="btn small danger" onclick="permanentDelete('${r.product_id}')">Delete Now</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Recycle Bin is empty.</div>'}</div>`}async function restoreProduct(id){await safe(async()=>{const r=await sb.rpc('restore_product',{p_product_id:id});if(r.error)throw r.error;await loadCore();await renderRecycle();toast('Product restored.')})}async function permanentDelete(id){if(!confirm('Delete now? Historical audit records will remain.'))return;await safe(async()=>{const r=await sb.rpc('permanent_delete_recycled',{p_product_id:id});if(r.error)throw r.error;await loadCore();await renderRecycle();toast('Recycle entry removed; audit history retained.')})}
(async()=>{const hash=new URLSearchParams(location.hash.replace(/^#/,''));const looksRecovery=hash.get('type')==='recovery';const {data:{session}}=await sb.auth.getSession();if(looksRecovery&&session)showPasswordReset();else if(session)await // Stable boot: restore a saved session once. Login/logout own their UI transitions.
startApp();
})();

<script id="keyline-mobile-search-fix">
(function(){
 function isKeylineContext(el){
   if(!el) return false;
   var ph=(el.getAttribute('placeholder')||'').toLowerCase();
   var id=(el.id||'').toLowerCase(), cls=(el.className||'').toString().toLowerCase();
   var page=el.closest('#keylinePage,#keyline,[data-page="keyline"],.keyline-page');
   return !!page || id.indexOf('keyline')>-1 || cls.indexOf('keyline')>-1 ||
          (ph.indexOf('search')>-1 && ph.indexOf('product')>-1 &&
           document.querySelector('#keylinePage,#keyline,[data-page="keyline"],.keyline-page'));
 }
 function filterKeyline(input){
   var q=(input.value||'').trim().toLowerCase();
   var root=input.closest('#keylinePage,#keyline,[data-page="keyline"],.keyline-page') || document;
   var rows=root.querySelectorAll('tbody tr');
   if(!rows.length) return;
   rows.forEach(function(row){
     var txt=(row.textContent||'').toLowerCase();
     row.style.display=(!q || txt.indexOf(q)>-1)?'':'none';
   });
 }
 document.addEventListener('input',function(e){
   var el=e.target;
   if(el && (el.tagName==='INPUT') && isKeylineContext(el)) filterKeyline(el);
 },true);
 document.addEventListener('search',function(e){
   if(isKeylineContext(e.target)) filterKeyline(e.target);
 },true);
})();
</script>


<script id="hotfix-mobile-v5-js">
(function(){
  function isMobile(){return window.matchMedia('(max-width:760px)').matches}

  function cardify(){
    if(!isMobile()) return;
    document.querySelectorAll('table').forEach(function(t){
      t.classList.add('mobileV5');
      var heads=Array.from(t.querySelectorAll('thead th')).map(function(h){return (h.textContent||'').trim()});
      t.querySelectorAll('tbody tr').forEach(function(row){
        Array.from(row.children).forEach(function(td,i){
          if(td.tagName==='TD') td.setAttribute('data-mobile-label',heads[i]||'');
        });
      });
    });
  }

  function fixKeylineSearch(){
    var s=document.getElementById('kSearch'), body=document.getElementById('kRows');
    if(!s||!body)return;
    var apply=function(){
      var q=(s.value||'').trim().toLowerCase();
      Array.from(body.rows||[]).forEach(function(row){
        var hay=(row.dataset.search||row.textContent||'').toLowerCase();
        row.classList.toggle('keylineHidden',!!q&&hay.indexOf(q)===-1);
      });
    };
    if(!s.dataset.mobileV5Bound){
      s.addEventListener('input',apply,true);
      s.addEventListener('search',apply,true);
      s.dataset.mobileV5Bound='1';
    }
    apply();
  }

  function enhance(){cardify();fixKeylineSearch();}

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enhance);else enhance();

  var timer;
  new MutationObserver(function(){
    clearTimeout(timer);
    timer=setTimeout(enhance,80);
  }).observe(document.body,{childList:true,subtree:true});

  window.addEventListener('resize',enhance);
})();
</script>
